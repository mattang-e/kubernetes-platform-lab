---
- name: Prepare Kubernetes nodes
  hosts: k8s
  become: true

  tasks:
    - name: Disable swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap permanently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Set SELinux to permissive
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure kernel modules to load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl parameters
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Ensure containerd is enabled and running
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

    - name: Ensure kubelet is enabled
      ansible.builtin.service:
        name: kubelet
        enabled: true